registry_schema: metric_registry@v1
metric: M-002
spec: M-002@v1
revision: v1.1
metric_status: registered
date: "2026-11-14"   # v1.1: fix cycle 2 (DEF-T002-arch-1): per-capture minimum evidence
title: No foot sliding
source: research/R-001.md §9 M-002@v1 (definitions §5)
reference_unit:
  tolerance_rel: 0.01
  values: {H_m: 80.0, leg_length_m: 42.4, com_height_stand_m: 44.8, mass_kg: 1.0e+7, I_yaw_kgm2: 4.75e+8,
           foot_length_m: 19.6, foot_width_m: 7.65, reactor_power_W: 2.0e+8, T_stride_nom_s: 6.60,
           fr_cruise_nom: 0.20, mu_assumed: 0.4, F_on_N: 2.943e+6, F_off_N: 9.81e+5}
required_captures: [walk_fr010, walk_fr020, walk_fr030, start, stop, estop, turn90_inplace, curve, stomp]
optional_captures: [walk_fr020_terrain]     # 20-stride walk on slope >= 5 deg "when the terrain exists"
procedure:
  g_mps2:       {value: 9.81, unit: m/s^2, status: derived, source: "physics; header g_mps2 must equal it"}
  min_contacts_per_foot: {value: 1, unit: contacts, status: derived, source: "reconciled C7: zero contacts is vacuous; checked per capture and foot"}
  F_on_mg:      {value: 0.03, unit: m*g, status: derived, source: "R-001 §5 (20 N of 700 N body weight)"}
  F_off_mg:     {value: 0.01, unit: m*g, status: derived, source: "R-001 §5 (<= 10 N toe-off)"}
  h_tol_Lf:     {value: 0.01, unit: L_f, status: derived, source: "R-001 §5 point loaded if <= 0.01 L_f above lowest"}
  ext_f_mg:     {value: 0.05, unit: m*g, status: derived, source: "R-001 §5 exclusion"}
  scuff_T:      {value: 0.1, unit: T_nom, status: derived, source: "R-001 §5 contacts < 0.1 T_nom tagged scuff"}
  worst_n:      {value: 5, unit: contacts, status: derived, source: "R-001 §9 report the worst 5 contacts"}
  p95_quantile: {value: 95, unit: percentile, status: derived, source: "R-001 §9 M-002.2"}
submeasures:
  M-002.1:
    title: Worst planted-foot slip, max over all contacts of all captures, s_c / L_f
    kind: gating
    thresholds:
      max_frac: {value: 0.005, unit: L_f, status: derived, source: "GAME_BREAKDOWN M-002 (< 0.5 % of foot length)"}
  M-002.2:
    title: p95 slip s_c / L_f (regression guard; reported)
    kind: advisory
    thresholds:
      p95_frac: {value: 0.0025, unit: L_f, status: assumed_pending_calibration, source: "R-001 §9 Assumed"}
  M-002.3:
    title: Sampling validity (fixed_dt <= 0.02 s, every step logged, float64 positions)
    kind: gating
    thresholds:
      dt_max_s: {value: 0.02, unit: s, status: derived, source: "R-001 §5 (>= 50 Hz)"}
  M-002.4:
    title: Contact detection consistency (emitter flag versus F_on / F_off hysteresis on fn)
    kind: gating
    thresholds:
      agree_min: {value: 0.99, unit: share of steps, status: derived, source: "R-001 §9"}
  M-002.5:
    title: Excluded contacts in locomotion captures (external force > 0.05 m g)
    kind: gating
    thresholds:
      excluded_max: {value: 0, unit: contacts, status: derived, source: "R-001 §9"}
