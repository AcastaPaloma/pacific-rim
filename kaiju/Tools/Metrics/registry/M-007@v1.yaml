registry_schema: metric_registry@v1
revision: v1.0
metric_status: registered
date: '2026-11-15'
metric: M-007
spec: M-007@v1
title: Kaiju look intelligent (behaviour clauses C1-C4; panel C5 pending; win rate C6 deferred)
source: research/R-024.md section 3 and 5 (rev 2); every threshold is an R-024 design target
note: Reads brain_log@v1 (kaiju_metrics/brain/brain_log.py). scripted@1 runs are measured, directcharge@1 is the null control.
procedure:
  scripted_brain_id: {value: scripted@1, unit: id, status: derived, source: "R-024 section 4 header brain_id"}
  control_brain_id: {value: directcharge@1, unit: id, status: derived, source: "R-024 section 3.1 null control"}
  bootstrap_resamples: {value: 2000, unit: resamples, status: derived, source: "R-024 section 5: 95 % bootstrap interval across runs"}
  flank_spread_deg: {value: 90.0, unit: deg, status: assumed_pending_calibration, source: "R-024 section 3.1 Flanked: spread >= 90 deg"}
  commit_fresh_s: {value: 8.0, unit: s, status: assumed_pending_calibration, source: "R-024 section 3.1 commit event: no pack Charge toward T in the previous 8 s"}
  thrash_window_s: {value: 4.0, unit: s, status: assumed_pending_calibration, source: "R-024 section 3.3 thrash: A-B-A within 4 s"}
  memory_s: {value: 3.0, unit: s, status: assumed_pending_calibration, source: "R-024 section 3.4 leak: not visible and memory age > 3 s"}
  bootstrap_ci_level: {value: 0.95, unit: ratio, status: derived, source: "R-024 section 5: 95 % bootstrap interval"}
  bootstrap_seed: {value: 7, unit: seed, status: derived, source: "deterministic report"}
submeasures:
  M-007.runs:
    title: Seeded run count per brain
    kind: gating
    thresholds:
      min_runs: {value: 100.0, unit: runs, status: derived, source: "R-024 section 5 definition: N = 100 seeded runs"}
  M-007.C1:
    title: C1 Flank commit rate FR_commit
    kind: gating
    thresholds:
      fr_commit_min: {value: 0.60, unit: ratio, status: assumed_pending_calibration, source: "R-024 section 5 C1 (design target)"}
      ratio_to_null_min: {value: 2.0, unit: x, status: assumed_pending_calibration, source: "R-024 section 5 C1: >= 2 x FR_commit_null"}
  M-007.C2:
    title: C2 Focus-fire excess FE
    kind: gating
    thresholds:
      fe_min: {value: 0.50, unit: ratio, status: assumed_pending_calibration, source: "R-024 section 5 C2"}
  M-007.C3:
    title: C3 Target switching (thrash fraction, voluntary switch rate)
    kind: gating
    thresholds:
      thrash_fraction_max: {value: 0.10, unit: ratio, status: assumed_pending_calibration, source: "R-024 section 5 C3"}
      switch_rate_max: {value: 3.0, unit: 1/kaiju-min, status: assumed_pending_calibration, source: "R-024 section 5 C3"}
  M-007.C4:
    title: C4 Information fairness (leaks)
    kind: gating
    thresholds:
      leaks_max: {value: 0, unit: ticks, status: derived, source: "R-024 section 3.4: brain must have 0 leaks"}
  M-007.C5:
    title: C5 Human panel smart / cheap
    kind: gating
    thresholds:
      smart_median_min: {value: 5.0, unit: score, status: assumed_pending_calibration, source: "R-024 section 5 C5"}
      cheap_median_max: {value: 3, unit: score, status: assumed_pending_calibration, source: "R-024 section 5 C5"}
      min_raters: {value: 12.0, unit: raters, status: derived, source: "R-024 section 5 C5"}
  M-007.C6:
    title: C6 Win rate vs scripted baseline (deferred)
    kind: gating
    thresholds:
      win_rate_min: {value: 0.55, unit: ratio, status: assumed_pending_calibration, source: "R-024 section 5 C6"}
