registry_schema: metric_registry@v1
metric: M-001
spec: M-001@v1
revision: v1.0
metric_status: registered        # draft | registered (orchestrator §4.4: a draft metric cannot fail anything)
date: "2026-11-14"
title: Feels heavy
source: research/R-001.md §9 M-001@v1 (derivations §0-§4, §7)
# Reference mech (R-001 §0). Header normalisers that differ by more than tolerance_rel are flagged
# NON_REFERENCE_NORMALISERS (warning, not a block: variant mechs and kaiju are legitimate).
reference_unit:
  tolerance_rel: 0.01
  values: {H_m: 80.0, leg_length_m: 42.4, com_height_stand_m: 44.8, mass_kg: 1.0e+7, I_yaw_kgm2: 4.75e+8,
           foot_length_m: 19.6, foot_width_m: 7.65, reactor_power_W: 2.0e+8, T_stride_nom_s: 6.60,
           fr_cruise_nom: 0.20, mu_assumed: 0.4, F_on_N: 2.943e+6, F_off_N: 9.81e+5}
required_captures: [walk_fr010, walk_fr020, walk_fr030, start, stop, estop, turn90_inplace, curve]
walk_captures: [walk_fr010, walk_fr020, walk_fr030]
cruise_capture: walk_fr020
procedure:
  g_mps2:              {value: 9.81, unit: m/s^2, status: derived, source: "physics; header g_mps2 must equal it"}
  smoothing_width_T:   {value: 0.05, unit: T_nom, status: derived, source: "R-001 §9 procedure 1 (centred moving average)"}
  steady_dv_gT:        {value: 0.02, unit: g*T, status: derived, source: "R-001 §9 procedure 3 (|dv| between strides)"}
  min_steady_strides:  {value: 3, unit: strides, status: derived, source: "R-001 §9 inputs (>= 3 strides of steady state)"}
  F_on_mg:             {value: 0.03, unit: m*g, status: derived, source: "R-001 §5 contact hysteresis"}
  F_off_mg:            {value: 0.01, unit: m*g, status: derived, source: "R-001 §5 contact hysteresis"}
  alexander_coef:      {value: 2.3, unit: "-", status: derived, source: "R-001 §1 [1] lambda/l = 2.3 Fr^0.3"}
  alexander_exp:       {value: -0.2, unit: "-", status: derived, source: "R-001 §1 T = 2.3 Fr^-0.2 sqrt(l/g)"}
  start_fraction:      {value: 0.9, unit: v_cruise, status: derived, source: "R-001 §4 start 0 -> 90 % of cruise"}
  stop_speed_mps:      {value: 0.3, unit: m/s, status: derived, source: "R-001 §4 stop: cruise -> < 0.3 m/s"}
  cruise_fraction_yaw: {value: 0.5, unit: v_cruise, status: derived, source: "R-001 §9 M-001.9 (v_bar > 0.5 v_cruise)"}
  ref_leg_length_m:    {value: 42.4, unit: m, status: derived, source: "R-001 §0 (scaling of M-001.7 / M-001.8)"}
  ref_half_width_over_h: {value: 0.08537946, unit: "-", status: derived, source: "R-001 §2: (W_f/2)/h = 3.825/44.8 at reference"}
submeasures:
  M-001.1:
    title: Froude number of steady walking, Fr = v_bar^2 / (g l)
    kind: gating
    thresholds:
      fr_lo:          {value: 0.10, unit: Fr, status: derived, source: "R-001 §1 band floor"}
      fr_hi:          {value: 0.30, unit: Fr, status: derived, source: "R-001 §1 band ceiling"}
      cruise_tol:     {value: 0.03, unit: Fr, status: assumed_pending_calibration, source: "R-001 §9: cruise within +-0.03 of fr_cruise_nom (0.20 Assumed)"}
      fr_never_above: {value: 0.35, unit: Fr, status: derived, source: "R-001 §1: above 0.35 the gait is a defect"}
  M-001.2:
    title: Stride period versus Alexander, T_meas / (2.3 Fr^-0.2 sqrt(l/g))
    kind: gating
    thresholds:
      ratio_lo: {value: 0.85, unit: "-", status: derived, source: "R-001 §1 +-15 % [1]"}
      ratio_hi: {value: 1.15, unit: "-", status: derived, source: "R-001 §1 +-15 % [1]"}
  M-001.3:
    title: Duty factor beta (mean per foot over steady strides); double support = 2 beta - 1
    kind: gating
    thresholds:
      duty_lo: {value: 0.60, unit: "-", status: derived, source: "R-001 §1 [5][10]"}
      duty_hi: {value: 0.72, unit: "-", status: assumed_pending_calibration, source: "R-001 §1 ceiling Assumed"}
  M-001.4:
    title: Peak fore-aft CoM acceleration (smoothed), all captures
    kind: gating
    thresholds:
      a_max_g: {value: 0.30, unit: g, status: derived, source: "R-001 §2: 75 % of traction, below forward tipping"}
  M-001.5:
    title: Peak lateral CoM acceleration (smoothed), all captures
    kind: gating
    thresholds:
      a_max_g: {value: 0.085, unit: "g at reference, scaled by header (W_f/2)/h", status: derived, source: "R-001 §2 single-support lateral tipping g (W_f/2)/h"}
  M-001.6:
    title: Net start acceleration (command to 90 % of cruise) and the power limit (P - c m g v)/(m v)
    kind: gating
    thresholds:
      a_net_max_g: {value: 0.14, unit: g, status: derived, source: "R-001 §2 (>= 2 steps to cruise)"}
      c_mech_cost: {value: 0.05, unit: "-", status: assumed_pending_calibration, source: "R-001 §2: mechanical cost of transport (reconciled reading: registry)"}
  M-001.7:
    title: Peak yaw rate (smoothed), all captures
    kind: gating
    thresholds:
      rate_max_dps: {value: 26.7, unit: "deg/s x sqrt(42.4/l)", status: derived, source: "R-001 §3 scaled human peak [16]"}
  M-001.8:
    title: Peak yaw acceleration (smoothed), all captures
    kind: gating
    thresholds:
      acc_max_dps2: {value: 4.0, unit: "deg/s^2 x (42.4/l)", status: derived, source: "R-001 §3 (x 0.0219 = l_h/l)"}
  M-001.9:
    title: Yaw rate while v_bar > 0.5 v_cruise, limit a_lat / v_bar
    kind: gating
    thresholds:
      a_lat_g: {value: 0.085, unit: "g at reference, scaled by header (W_f/2)/h", status: assumed_pending_calibration, source: "R-001 §3 curve walking (Assumed)"}
  M-001.10:
    title: Time to start (command to 90 % of cruise) in steps (step = T_nom / 2)
    kind: gating
    thresholds:
      steps_lo: {value: 2.0, unit: steps, status: derived, source: "R-001 §4 [20]"}
      steps_hi: {value: 4.0, unit: steps, status: assumed_pending_calibration, source: "R-001 §4 ceiling Assumed"}
  M-001.11:
    title: Time to stop, normal (cruise to < 0.3 m/s), in steps and t* = t / sqrt(l/g)
    kind: gating
    thresholds:
      steps_lo: {value: 1.5, unit: steps, status: derived, source: "R-001 §4 [21]"}
      steps_hi: {value: 3.0, unit: steps, status: assumed_pending_calibration, source: "R-001 §4 ceiling Assumed"}
      tstar_lo: {value: 2.4, unit: "t/sqrt(l/g)", status: derived, source: "R-001 §4"}
      tstar_hi: {value: 4.8, unit: "t/sqrt(l/g)", status: assumed_pending_calibration, source: "R-001 §4 ceiling Assumed"}
  M-001.12:
    title: Time to stop, emergency >= max(v_cruise / a_ref, m v0 / F_brake,max)
    kind: gating
    thresholds:
      a_ref_g: {value: 0.30, unit: g, status: assumed_pending_calibration, source: "R-001 §2/§4 (3.1 s = v/(0.30 g)); reconciled reading"}
  M-001.13:
    title: Panel score "feels like 10,000 t"
    kind: gating
    thresholds:
      median_overall_min:  {value: 8.0, unit: score, status: derived, source: "R-001 §7 pass rule"}
      scenario_median_max_fail: {value: 6.0, unit: score, status: derived, source: "R-001 §7: no scenario median <= 6"}
      min_raters:          {value: 3, unit: raters, status: derived, source: "R-001 §7 panel of >= 3"}
    scenarios: [cruise, start, stop, turn90_inplace, curve]
